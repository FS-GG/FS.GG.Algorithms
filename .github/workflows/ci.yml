name: ci

# Build, property tests, the lockstep corpus, the Fable proof and a bench-harness smoke. No secret is read and
# nothing is published. Recorded bench baselines are never produced here: they need fdev's quiet-host probe
# (bench/run.sh, ADR-0098 §4.3).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Locked restore
        run: dotnet restore FS.GG.Algorithms.slnx --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build FS.GG.Algorithms.slnx --no-restore -c Release

      # The whole suite takes about 2 seconds. A step bound well above that makes a hang fail in minutes, not at the
      # 20-minute job limit (FS-GG/FS.GG.Algorithms#34).
      - name: Property tests (FsCheck against independent oracles)
        timeout-minutes: 5
        run: dotnet run --project tests/FS.GG.Algorithms.Tests -c Release --no-build -- --no-spinner

      # Negative control (FS-GG/FS.GG.Algorithms#34). The runner's failure path must not hang. Before the fix, a failing
      # property deadlocked the parallel Expecto run (Expecto's console writer lock against the .NET console lock) and
      # CI saw only the job timeout. Eight properties that can never hold join the suite, which stays parallel, and the
      # run must exit non-zero inside the bound with exactly eight failures. Exit 124 or 137 is the hang this guards.
      - name: Negative control (a failing property fails the run within 2 minutes)
        shell: bash
        run: |
          set -u
          control=8
          bound=120
          log="$RUNNER_TEMP/negative-control.log"
          start=$SECONDS
          # The runner's shell has -e: the non-zero exit being tested must not end the step.
          code=0
          FSGG_ALGO_NEGATIVE_CONTROL=$control timeout --kill-after=10 "$bound" \
            dotnet tests/FS.GG.Algorithms.Tests/bin/Release/net10.0/FS.GG.Algorithms.Tests.dll --no-spinner --colours 0 \
            > "$log" 2>&1 || code=$?
          elapsed=$((SECONDS - start))
          tail -n 4 "$log"
          echo "negative control: exit $code after ${elapsed}s (bound ${bound}s)"
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "::error::the failing properties hung the run: it was killed at the ${bound}s bound"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::eight failing properties produced a passing run: the control is not exercised"
            exit 1
          fi
          summary=$(grep -E 'EXPECTO! [0-9]+ tests run' "$log" | tail -n 1)
          failed=$(sed -E 's/.* ([0-9]+) failed, ([0-9]+) errored.*/\1 \2/' <<<"$summary")
          read -r nfailed nerrored <<<"$failed"
          if [ -z "${nfailed:-}" ] || [ -z "${nerrored:-}" ] || [ $((nfailed + nerrored)) -ne "$control" ]; then
            echo "::error::expected exactly $control failing properties, the summary says: ${summary:-none}"
            exit 1
          fi
          echo "negative control passed: $control failing properties failed the run in ${elapsed}s"

      - name: Lockstep input corpus is current
        run: python3 -I scripts/lockstep-fixtures.py check

      - name: Scripts parse
        run: |
          set -euo pipefail
          for f in eng/*.sh bench/*.sh; do bash -n "$f"; done
          python3 -I -m py_compile scripts/lockstep-fixtures.py bench/assemble.py bench/combine.py eng/release-checks.py
          node --check bench/fable/run.mjs

      - name: Release safety checks (mocked feeds and runs)
        run: python3 -I eng/release-checks.test.py

      - name: Bench combine checks (synthetic runs)
        run: python3 -I bench/combine.test.py

  fable-proof:
    name: fable-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install Node (the toolchain manifest's major)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The same canonical input bytes on .NET and on Fable/Node, byte-identical canonical output equal to
      # expected.bin, the independent oracle, the 10^5 stack checks under Node's default stack, and a clean
      # consumer compiled by Fable from the packed package.
      - name: Fable proof (ADR-0069)
        run: eng/fable-proof.sh "$RUNNER_TEMP/fable-proof"

  bench-smoke:
    name: bench-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Proves the two-runtime harness and the results schema; records nothing (timings on a shared runner are
      # not evidence). Work counts must agree between .NET and Node.
      - name: Bench harness smoke (BenchmarkDotNet Dry job and Node, one results schema)
        env:
          TMPDIR: ${{ runner.temp }}
        run: bench/run.sh --smoke
