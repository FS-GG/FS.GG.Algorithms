# LOCAL MIGRATION TEMPLATE: replace the unresolved operand only with the actual accepted Root120 Hub commit.
# The canonical Hub receiver owns the lint and independently pins/verifies its rule source.
# This repository carries no lint script or copied lint shell.
name: closing-keywords

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: closing-keywords-${{ contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  canonical-receiver:
    uses: FS-GG/.github/.github/workflows/closing-keywords-receiver.yml@10cee3d3b101a252f6500049b144edec8d8ef288

  # Preserve the existing required closing-keywords context (GitHub Actions App15368).
  closing-keywords:
    name: closing-keywords
    needs: [canonical-receiver]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful canonical receiver execution
        env:
          RECEIVER_RESULT: ${{ needs.canonical-receiver.result }}
        run: |
          set -eu
          if [ "$RECEIVER_RESULT" != success ]; then
            echo "::error title=closing-keywords: no successful canonical receiver::the canonical receiver did not succeed"
            exit 1
          fi
